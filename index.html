function auditChanges(before,after){
 try{const old=JSON.parse(before||'{}'),collections=['students','groups','sessions','payments','obligations','receipts','settlements','teacherLoans','refunds'];const changes=[];for(const key of collections){const a=old[key]||[],b=after[key]||[],am=new Map(a.map(x=>[x.id,JSON.stringify(x)])),bm=new Map(b.map(x=>[x.id,JSON.stringify(x)]));for(const [id,val] of bm){if(!am.has(id))changes.push({entity:key,recordId:id,action:'created'});else if(am.get(id)!==val)changes.push({entity:key,recordId:id,action:'updated'});}for(const [id] of am)if(!bm.has(id))changes.push({entity:key,recordId:id,action:'deleted'});}
 if(changes.length){after.auditLog=after.auditLog||[];after.auditLog.unshift({id:uid(),at:new Date().toISOString(),actor:after.settings?.teacher||'Local user',summary:changes.map(x=>`${x.action} ${x.entity}`).join('; '),changes});after.auditLog=after.auditLog.slice(0,500);}
 }catch(e){console.warn('Audit log could not be written',e)}

function translateArabicPage(){
 if(lang!=='ar')return;
 const rootNode=document.body;
 const walker=document.createTreeWalker(rootNode,NodeFilter.SHOW_TEXT);
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 for(const n of nodes){let s=n.nodeValue.trim();if(!s)continue;
   if(arUI[s]){n.nodeValue=n.nodeValue.replace(s,arUI[s]);continue;}if(arMore[s]){n.nodeValue=n.nodeValue.replace(s,arMore[s]);continue;}
   let out=s;
   for(const [en,ar] of Object.entries({...arUI,...arMore})){if(en.length>3&&out.includes(en))out=out.replaceAll(en,ar);}
   if(out!==s)n.nodeValue=n.nodeValue.replace(s,out);
 }
 rootNode.querySelectorAll('input[placeholder],textarea[placeholder],button[title]').forEach(el=>{
   const attr=el.hasAttribute('placeholder')?'placeholder':'title';
   if(arUI[el.getAttribute(attr)])el.setAttribute(attr,arUI[el.getAttribute(attr)]);
 });
}

ction="edit-student" data-id="${s.id}">${T('edit')}</button> <button class="btn small danger" data-action="archive-student" data-id="${s.id}">×</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="card empty">${T('noData')}</div>`;}['studentSearch','studentGroup','studentType'].forEach(id=>$('#'+id).addEventListener('input',fill));fill();}

function studentSessionLedger(st,g,sessions){
 const attended=sessions.filter(x=>['present','late'].includes(x.attendance?.[st.id])).sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||'').localeCompare(b.createdAt||''));
 const payments=data.payments.filter(p=>p.studentId===st.id&&p.groupId===g.id&&['private','revision','debt'].includes(p.category)).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.createdAt||'').localeCompare(b.createdAt||''));
 const covered=new Set(); payments.forEach(p=>(p.sessionIds||[]).forEach(id=>covered.add(id)));
 // Cycle payments cover attended sessions at the per-session rate (cycle fee / 4), not the whole cycle fee.
 if(g.type==='private'){const size=4,fee=privateCycleFee(st,g),perSession=fee/4;for(let c=1;c<=Math.ceil(sessions.length/size);c++){if(perSession<=0)continue;const block=sessions.slice((c-1)*size,c*size).filter(x=>['present','late'].includes(x.attendance?.[st.id]));const paid=payments.filter(p=>!p.voided&&Number(p.cycleNumber)===c&&['private','revision'].includes(p.category)).reduce((a,p)=>a+Number(p.amount||0),0)+payments.filter(p=>!p.voided&&p.category==='debt'&&Number(p.originalCycleNumber)===c).reduce((a,p)=>a+Number(p.amount||0),0);let credits=Math.min(block.length,Math.floor((paid+0.00001)/perSession));for(const x of block){if(credits<=0)break;if(!covered.has(x.id)){covered.add(x.id);credits--;}}}}
 let prepaidTotal=0,prepaidUsed=0;
 for(const p of payments){let credits=Math.max(0,Math.floor(Number(p.prepaidSessions||0)));prepaidTotal+=credits;if(!credits)continue;const eligible=attended.filter(x=>!covered.has(x.id)&&(!p.date||x.date>=p.date));for(const session of eligible){if(credits<=0)break;covered.add(session.id);credits--;prepaidUsed++;}}
 const unpaid=attended.filter(x=>!covered.has(x.id));
 return {attended,unpaid,covered,prepaidRemaining:Math.max(0,prepaidTotal-prepaidUsed),prepaidTotal,prepaidUsed};
}
function groupFinancials(gid){let ps=data.payments.filter(p=>p.groupId===gid),g=group(gid),priv=ps.filter(p=>p.category==='private').reduce((a,p)=>a+Number(p.amount||0),0),rev=ps.filter(p=>p.category==='revision').reduce((a,p)=>a+Number(p.amount||0),0),cefr=ps.filter(p=>p.category==='cefr').reduce((a,p)=>a+Number(p.amount||0),0),books=ps.filter(p=>p.category==='book').reduce((a,p)=>a+Number(p.amount||0),0),insurance=ps.filter(p=>['insurance','school','insurance-school'].includes(p.category)).reduce((a,p)=>a+Number(p.amount||0),0),share=.75,total=priv+rev+cefr+books+insurance;return {priv,rev,cefr,books,insurance,total,teacher:priv*.75+rev*share+cefr*.70+books,school:priv*.25+rev*(1-share)+cefr*.30+insurance};}

function cycleFinancialRows(g){const all=data.sessions.filter(x=>x.groupId===g.id).sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||'').localeCompare(b.createdAt||''));const size=g.type==='private'?4:g.type==='cefr'?16:0;const maxPaidCycle=data.payments.filter(p=>p.groupId===g.id&&!p.voided).reduce((m,p)=>Math.max(m,Number(p.cycleNumber||0)),0);const n=size?Math.max(1,Math.ceil(all.length/size),maxPaidCycle):Math.max(1,all.length,maxPaidCycle);return Array.from({length:n},(_,i)=>{const ss=size?all.slice(i*size,(i+1)*size):all.slice(i,i+1),ids=new Set(ss.map(x=>x.id));const ps=data.payments.filter(p=>p.groupId===g.id&&Number(p.amount)>0&&!p.voided&&(!(p.purpose==='prepayment')||ss.length>0)&&((p.category==='debt'&&Number(p.cycleNumber)===i+1)||(['private','revision'].includes(p.category)&&Number(p.cycleNumber)===i+1)||((p.category||'')!=='debt'&&!['private','revision'].includes(p.category)&&(p.sessionIds||[]).some(id=>ids.has(id)))||((p.category==='cefr')&&Number(data.obligations.find(o=>o.id===p.obligationId)?.cycle||p.cycleNumber)===i+1)||(['book','insurance','school','insurance-school'].includes(p.category)&&Number(p.cycleNumber)===i+1)));const ordinary=ps.filter(p=>p.category!=='debt'),debt=ps.filter(p=>p.category==='debt');const ordinaryReceived=ordinary.reduce((a,p)=>a+Number(p.amount||0),0),debtRecovered=debt.reduce((a,p)=>a+Number(p.amount||0),0),received=ordinaryReceived+debtRecovered,bookReceipts=ps.filter(p=>p.category==='book').reduce((a,p)=>a+Number(p.amount||0),0),insuranceReceipts=ps.filter(p=>['insurance','school','insurance-school'].includes(p.category)).reduce((a,p)=>a+Number(p.amount||0),0),tuitionReceipts=received-bookReceipts-insuranceReceipts;const rate=g.type==='private'?.75:g.type==='cefr'?.70:.75;let teacher=0,partner=0,schoolOnly=0;for(const p of ps){const amt=Number(p.amount||0);if(p.category==='book'){teacher+=amt;continue;}if(['insurance','school','insurance-school'].includes(p.category)){partner+=amt;schoolOnly+=amt;continue;}teac function recordSettlementPart(gid,no,party){const g=group(gid),c=cycleFinancialRows(g||{}).find(x=>x.no===Number(no));if(!g||!c)return;const required=g.type==='private'?4:g.type==='cefr'?16:0;if(c.received<=0){toast('No money has been received for this cycle. Settlement is unavailable.');return;}if(required&&c.sessionCount<required){toast('This cycle is not complete yet.');return;}let row=data.settlements.find(x=>x.groupId===gid&&x.cycleNo===Number(no));if(!row){row={id:uid(),groupId:gid,cycleNo:Number(no),date:today(),teacherPaid:false,partnerPaid:false,teacherReceived:0,partnerReceived:0,loanDeduction:0};data.settlements.push(row);}if(party==='teacher'){if(row.teacherPaid){toast('Teacher payment for this cycle is already recorded.');return;}const outstanding=(data.teacherLoans||[]).reduce((a,l)=>a+teacherLoanRemaining(l),0);const deduction=Math.min(outstanding,c.teacher);let left=deduction;for(const l of data.teacherLoans){const take=Math.min(teacherLoanAutoRemaining(l),left);l.deducted=Number(l.deducted||0)+take;left-=take;if(!left)break;}row.loanDeduction=deduction;row.teacherShare=c.teacher;row.teacherReceived=Math.max(0,c.teacher-deduction);row.teacherPaid=true;row.teacherPaidDate=today();}else{if(row.partnerPaid){toast('Partner payment for this cycle is already recorded.');return;}row.partnerShare=c.partner;row.partnerReceived=c.partner;row.partnerPaid=true;row.partnerPaidDate=today();}row.date=today();save(false);render();const latest=cycleFinancialRows(g).find(x=>x.no===Number(no));const saved=data.settlements.find(x=>x.groupId===gid&&x.cycleNo===Number(no));printHtmlReport('Cycle settlement',cycleStatementHtml(g,latest));}
function showCycleFinancialReport(gid,no){const g=group(gid),c=cycleFinancialRows(g||{}).find(x=>x.no===Number(no));if(!g||!c)return;printHtmlReport('Cycle financial statement',cycleStatementHtml(g,c));}
function addTeacherLoan(){const body=`<form id="loanForm"><div class="field"><label>Date</label><input name="date" type="date" value="${today()}"></div><div class="field"><label>Amount</label><input name="amount" type="number" min="1" required></div><div class="field"><label>Reason</label><input name="note"></div><div class="field"><label>Repayment method</label><select name="repaymentMode"><option value="auto">Automatically deduct from future teacher earnings</option><option value="manual">Manual / cash settlement (do not deduct from earnings)</option></select></div></form>`;modal('Record teacher loan / advance',body,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="saveLoan">Save</button>`);$('#saveLoan').onclick=()=>{const f=new FormData($('#loanForm'));data.teacherLoans.push({id:uid(),date:f.get('date'),amount:Number(f.get('amount')),note:f.get('note')||'',repaymentMode:f.get('repaymentMode')||'auto',deducted:0,manuallySettled:0});save(false);closeModal();render();};}

function settleCycle(gid,no){const g=group(gid),c=cycleFinancialRows(g||{}).find(x=>x.no===Number(no));if(!g||!c)return;let left=data.teacherLoans.reduce((a,l)=>a+teacherLoanAutoRemaining(l),0),ded=Math.min(left,c.teacher);for(const l of data.teacherLoans){const take=Math.min(teacherLoanAutoRemaining(l),ded);l.deducted+=take;ded-=take;if(!ded)break;}const row={id:uid(),groupId:gid,cycleNo:Number(no),date:today(),teacherShare:c.teacher,partnerShare:c.partner,teacherReceived:Math.max(0,c.teacher-Math.min(left,c.teacher)),partnerReceived:c.partner,loanDeduction:Math.min(left,c.teacher)};data.settlements.push(row);save(false);render();printHtmlReport('Cycle settlement',`<h2>Cycle settlement</h2><p>Group ${esc(g.name)} · Cycle ${no} · ${today()}</p><p>Received by teacher: ${money(row.teacherReceived)} (share ${money(c.teacher)})</p><p>Received by partner: ${money(row.partnerReceived)}</p><p>Loan deduction: ${money(row.loanDeduction)}</p><p>Teacher signature: __________________ Partner signature: __________________</p>`);}

function privateCycleSize(g){return g?.type==='private'?4:g?.type==='cefr'?16:0;}
function groupCycleNo(gid){const g=group(gid),size=privateCycleSize(g);if(!g||!size)return 1;const n=data.sessions.filter(x=>x.groupId===gid&&!x.individualFor).length;return Math.max(1,Math.floor(Math.max(0,n-1)/size)+1);}
function privateCyclePayments(stId,gid,cycleNo){return data.payments.filter(p=>p.studentId===stId&&p.groupId===gid&&Number(p.cycleNumber||0)===Number(cycleNo)&&['private','revision'].includes(p.category)&&!p.voided).reduce((a,p)=>a+Number(p.amount||0),0);}
function privateCycleFee(st,g){return Number(st?.privateFee??g?.defaultFee??0);}
function privateCycleSessions(g,cycleNo){const size=privateCycleSize(g)||4;const ss=data.sessions.filter(x=>x.groupId===g.id&&!x.individualFor).sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||'').localeCompare(b.createdAt||''));return ss.slice((Number(cycleNo)-1)*size,Number(cycleNo)*size);}
function privateCycleAttendedCount(st,g,cycleNo){return privateCycleSessions(g,cycleNo).filter(x=>['present','late'].includes(x.attendance?.[st.id])).length;}
function privateCycleAmountDue(st,g,cycleNo){if(g?.type==='revision')return privateCycleAttendedCount(st,g,cycleNo)*Number(st.revisionSessionFee??g.revisionSessionFee??g.defaultFee??0);return privateCycleAttendedCount(st,g,cycleNo)*(privateCycleFee(st,g)/4);}
function studentHasEnteredNextCycle(st,g,cycleNo){const size=privateCycleSize(g)||4;const ss=data.sessions.filter(x=>x.groupId===g.id&&!x.individualFor).sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||'').localeCompare(b.createdAt||''));const next=ss.slice(Number(cycleNo)*size,(Number(cycleNo)+1)*size);return next.some(x=>['present','late'].includes(x.attendance?.[st.id]));}
function privateCycleCreditCarryIn(st,g,cycleNo){
 // Private-course unused prepaid tuition is a student credit. Carry it forward
 // cycle by cycle, applying it to attended sessions only. Revision courses are unchanged.
 if(!st||!g||g.type!=='private'||Number(cycleNo)<=1)return 0;
 let credit=0;
 for(let c=1;c<Number(cycleNo);c++){
  const paid=privateCyclePayments(st.id,g.id,c);
  const due=privateCycleAmountDue(st,g,c);
  credit=Math.max(0,credit+paid-due);
 }
 return credit;
}
function privateCycleEffectivePaid(st,g,cycleNo){return privateCyclePayments(st.id,g.id,cycleNo)+privateCycleCreditCarryIn(st,g,cycleNo);}
function privateCycleDebt(st,g,cycleNo){const attended=privateCycleAttendedCount(st,g,cycleNo);if(!attended)return 0;const due=privateCycleAmountDue(st,g,cycleNo);const normal=privateCyclePayments(st.id,g.id,cycleNo);const carry=g?.type==='private'?privateCycleCreditCarryIn(st,g,cycleNo):0;const recovered=data.payments.filter(p=>p.studentId===st.id&&p.groupId===g.id&&p.category==='debt'&&Number(p.originalCycleNumber)===Number(cycleNo)&&!p.voided).reduce((a,p)=>a+Number(p.amount||0),0);return Math.max(0,due-normal-carry-recovered);}

 const cycleStudents=g?activeStudents(g.id):[];
 const rows=cycleStudents.map(st=>{let attended=sessions.filter(x=>['present','late'].includes(x.attendance?.[st.id]));let dates=slots.map(x=>{let ok=x&&['present','late'].includes(x.attendance?.[st.id]);return `<td>${ok?esc(x.date):'<span class="muted">—</span>'}</td>`}).join('');let ledger=studentSessionLedger(st,g,all);let paidInCycle=0;let fee=Number(st.privateFee??g.defaultFee??0);let cefrOb=data.obligations.find(o=>o.groupId===g.id&&o.studentId===st.id&&o.type==='cefr'&&Number(o.cycle)===cycleNo);if(g.type==='cefr'){paidInCycle=cefrOb?totalPaid(cefrOb.id):data.payments.filter(p=>p.studentId===st.id&&p.groupId===g.id&&p.category==='cefr'&&!p.voided&&Number(p.cycleNumber||1)===cycleNo).reduce((a,p)=>a+Number(p.amount||0),0);}else{paidInCycle=privateCyclePayments(st.id,g.id,cycleNo); }let amount=g.type==='private'?privateCycleAmountDue(st,g,cycleNo):g.type==='cefr'?Number(st.courseFee??g.courseFee??0):Number(st.revisionSessionFee??g.revisionSessionFee??g.defaultFee??0)*attended.length;let debtRecoveredHere=data.payments.filter(p=>p.studentId===st.id&&p.groupId===g.id&&p.category==='debt'&&Number(p.originalCycleNumber)===cycleNo&&!p.voided).reduce((a,p)=>a+Number(p.amount||0),0);let carryIn=g.type==='private'?privateCycleCreditCarryIn(st,g,cycleNo):0;let balance=g.type==='cefr'?Math.max(0,amount-paidInCycle):Math.max(0,amount-paidInCycle-carryIn-debtRecoveredHere);let effectiveReceived=paidInCycle+carryIn+debtRecoveredHere;let paid=balance<=0&&effectiveReceived>0,partial=!paid&&effectiveReceived>0;let payBtn=`<button class="btn small primary" data-action="group-student-pay" data-id="${st.id}" data-group="${g.id}">${T('recordPayment')}</button>`;return `<tr><td><strong>${esc(st.name)}</strong><div class="muted">${esc(st.phone||'')}</div></td>${dates}<td><span class="badge ${paid?'green':partial?'amber':'red'}">${paid?T('paid'):partial?T('partial'):T('unpaid')}</span><div class="muted">${money(paidInCycle+carryIn+debtRecoveredHere)} received including carried credit · ${money(balance)} remaining</div>${g.type==='private'&&cycleNo>1&&privateCycleDebt(st,g,cycleNo-1)>0?`<span class="badge red">Previous debt: ${money(privateCycleDebt(st,g,cycleNo-1))}</span>`:''}</td><td>${money(amount)}</td><td>${payBtn} <button class="btn small" data-action="profile" data-id="${st.id}">${T('studentProfile')}</button></td></tr>`}).join('');
 let headers=slots.map((x,i)=>`<th>${T('sessionCount')} ${i+1}<div class="muted" style="font-weight:400">${x?esc(x.date):'—'}</div></th>`).join('');
 v.innerHTML=`<div class="between"><div><h2 class="section-title">${T('cycles')}</h2><div class="muted">${T('cyclePageIntro')}</div></div></div><div class="card"><div class="toolbar"><label>${T('group')}</label><select id="cycleGroup">${groups.map(x=>`<option value="${x.id}" ${x.id===gid?'selected':''}>${esc(x.name)} · ${T(x.type==='private'?'private':x.type==='cefr'?'cefr':'revision')}</option>`).join('')}</select><label>${T('cycleNumber')}</label><select id="cycleNo">${Array.from({length:count},(_,i)=>`<option value="${i+1}" ${i+1===cycleNo?'selected':''}>${i+1}</option>`).join('')}</select><button class="btn primary" id="cyclePrint">${T('cycleReport')}</button></div><div class="notice">${g?(g.type==='private'?'Private courses: 4 group sessions per cycle.':g.type==='cefr'?'CEFR: 16 programme sessions per cycle.':'Revision courses: flexible, open cycle.') :T('noGroup')}</div>${g?`<div class="between"><div><strong>${esc(g.name)}</strong><div class="muted">${T('cycleSessions')}: ${sessions.length}${target?` / ${target}`:''} · ${sessions.length>=target&&target?T('cycleClosed'):T('cycleOpen')}</div></div><button class="btn" id="cycleAddStudent">＋ ${T('addStudentToCycle')}</button></div><div class="tablewrap" style="margin-top:12px"><table style="min-width:850px"><thead><tr><th>${T('student')}</th>${headers}<th>${T('status')}</th><th>${T('cycleAmount')}</th><th>${T('actions')}</th></tr></thead><tbody>${rows||`<tr><td colspan="${5+sessions.length}">${T('noData')}</td></tr>`}</tbody></table></div>`:''}</div>`;
 $('#cycleGroup')?.addEventListener('change',e=>{window.ptmCycleGroup=e.target.value;window.ptmCycleNo=1;render();});$('#cycleNo')?.addEventListener('change',e=>{window.ptmCycleNo=Number(e.target.value);render();});$('#cycleAddStudent')?.addEventListener('click',()=>{if(g)studentForm(null,g.id);});
 $('#cyclePrint')?.addEventListener('click',()=>{if(!g)return;let html=`<div class="school">${esc(data.settings.school||'Teaching Manager')}</div><h2>${T('cycleReport')} — ${esc(g.name)}</h2><p>Cycle ${cycleNo} · ${esc(g.type)} · Generated ${today()}</p><table><thead><tr><th>${T('student')}</th>${headers}<th>${T('status')}</th><th>${T('cycleAmount')}</th></tr></thead><tbody>${rows.replace(/<button[^>]*>[\s\S]*?<\/button>/g,'')}</tbody></table>${cycleStatementHtml(g,cycleFinancialRows(g).find(x=>x.no===cycleNo))}`;printHtmlReport('Cycle report',html);});
}

function renderSessions(v){
 const groups=data.groups;v.innerHTML=`<div class="between"><div><h2 class="section-title">${T('sessions')}</h2><div class="muted">${lang==='fr'?'Registre des séances et rapports de présence.':lang==='ar'?'سجل الحصص وتقارير الحضور.':'Session register and attendance reports.'}</div></div><button class="btn primary" data-action="add-session">＋ ${T('addSession')}</button></div>
 <div class="card"><div class="toolbar"><select id="sessionTypeFilter"><option value="">${T('all')} ${T('type')}</option><option value="private">${T('private')}</option><option value="cefr">${T('cefr')}</option><option value="revision">Revision courses</option></select><select id="sessionGroupFilter"><option value="">${T('allGroups')}</option>${groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select><select id="sessionPeriodFilter"><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="four">Four sessions</option></select><input type="date" id="sessionDateFilter" value="${today()}"><button class="btn primary" id="sessionReportRun">${T('generateReceipt')||'Generate report'}</button><button class="btn" id="sessionReportPrint">${T('print')}</button></div><div id="sessionReport"></div></div>
 <div class="card" style="margin-top:14px"><h3 class="section-title">${T('recentSessions')}</h3><div id="sessionRegister"></div></div>`;
 const run=()=>{let typ=$('#sessionTypeFilter').value,gid=$('#sessionGroupFilter').value,period=$('#sessionPeriodFilter').value,d=$('#sessionDateFilter').value||today();let start=d,end=d;if(period==='weekly'){let z=new Date(d+'T12:00:00');z.setDate(z.getDate()-((z.getDay()+6)%7));start=z.toISOString().slice(0,10);z.setDate(z.getDate()+6);end=z.toISOString().slice(0,10);}let ss=data.sessions.filter(x=>(!gid||x.groupId===gid)&&(!typ||group(x.groupId)?.type===typ)&&x.date>=start&&x.date<=end).sort((a,b)=>a.date.localeCompare(b.date));if(period==='four'&&gid){ss=ss.slice(-4);}const html=ss.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(group(x.groupId)?.name||'')}</td><td>${esc(group(x.groupId)?.type||'')}</td><td>${Object.entries(x.attendance||{}).filter(([sid,a])=>['present','late'].includes(a)).map(([sid,a])=>`${esc(student(sid)?.name||'')} (${T(a)})`).join(', ')||'—'}</td><td>${esc(x.notes||'—')}</td></tr>`).join('');$('#sessionReport').innerHTML=`<div class="between"><strong>${ss.length} ${T('sessionsDone')}</strong><span class="muted">${start} – ${end}</span></div><div class="tablewrap"><table><thead><tr><th>${T('date')}</th><th>${T('group')}</th><th>${T('type')}</th><th>${T('attendance')}</th><th>${T('notes')}</th></tr></thead><tbody>${html||`<tr><td colspan="5">${T('noData')}</td></tr>`}</tbody></table></div>`;$('#sessionRegister').innerHTML=$('#sessionReport').innerHTML;};
 ['sessionTypeFilter','sessionGroupFilter','sessionPeriodFilter','sessionDateFilter'].forEach(id=>$('#'+id).addEventListener('change',run));$('#sessionReportRun').onclick=run;$('#sessionReportPrint').onclick=()=>printHtmlReport('Session attendance report',$('#sessionReport').innerHTML);run();
}
// Delegated actions for the student ledger.
$('#modalback').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;if(a==='profile-delete-session'){deleteStudentSession(id,b.dataset.session);return;}if(a==='profile-toggle-session'||a==='profile-add-attendance'){let sid=a==='profile-toggle-session'?b.dataset.session:$('#profileExistingSession')?.value;if(!sid){toast('Choose a group session first.');return;}let ss=data.sessions.find(x=>x.id===sid);if(!ss)return;ss.attendance=ss.attendance||{};ss.attendance[id]='present';save(false);profile(id);toast(T('attendanceUpdated'));}else if(a==='profile-individual-session'){let st=student(id),g=group(st?.groupId);if(!st||!g)return;let d=$('#profileIndividualDate')?.value||today(),note=$('#profileIndividualNote')?.value||T('individualCatchup');let groupSession=data.sessions.filter(x=>x.groupId===g.id&&!x.individualFor&&x.date===d).sort((x,y)=>(x.createdAt||'').localeCompare(y.createdAt||''))[0];if(groupSession){groupSession.attendance=groupSession.attendance||{};groupSession.attendance[id]='present';save(false);profile(id);toast('Attendance added to the existing group session. No new session was created.');return;}let rec=data.sessions.find(x=>x.groupId===g.id&&x.date===d&&x.individualFor===id);if(rec){rec.attendance=rec.attendance||{};rec.attendance[id]='present';}else data.sessions.push({id:uid(),groupId:g.id,date:d,duration:90,notes:note,attendance:{[id]:'present'},individualFor:id,createdAt:new Date().toISOString()});save(false);profile(id);toast(T('individualAdded'));}});

// First-run example group names are intentionally not pre-populated; create only what the teacher actually uses.
if(!localStorage.getItem(DBKEY)){data=blank();localStorage.setItem(DBKEY,JSON.stringify(data));makeBackup();}
$('#undoAction').addEventListener('click',undoChange);$('#redoAction').addEventListener('click',redoChange);updateHistoryButtons();
let deferredInstallPrompt=null;const installBtn=$('#installApp');const isInstalled=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;installBtn.hidden=false;if(isInstalled()){installBtn.textContent='✓ '+T('installed');installBtn.disabled=true;}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;installBtn.hidden=false;installBtn.textContent='⇩ '+T('install');});installBtn.addEventListener('click',async()=>{if(isInstalled()){toast('This app is already installed.');return;}if(deferredInstallPrompt){deferredInstallPrompt.prompt();let choice=await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;if(choice?.outcome==='accepted'){installBtn.textContent='✓ '+T('installed');installBtn.disabled=true;}return;}let msg='To install on Windows Chrome: open ⋮ menu → Cast, save and share → Install page as app (or More tools → Create shortcut, then tick Open as window). On Android Chrome: ⋮ → Install app / Add to Home screen. If this option is missing, check that GitHub Pages is using HTTPS, the manifest and service worker load successfully, then hard-refresh.';modal('Install Private Teaching Manager',`<div class="notice">${esc(msg)}</div><p><strong>App install status:</strong> ${isInstalled()?'Installed':'Not installed in this browser'}.</p><p class="muted">The button remains visible so the installation instructions are always available.</p>`,`<button class="btn primary" data-close>Close</button>`);});window.addEventListener('appinstalled',()=>{installBtn.textContent='✓ '+T('installed');installBtn.disabled=true;toast(T('installed')); });
if('serviceWorker'in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{scope:'./',updateViaCache:'none'}).then(reg=>{reg.update();if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});}).catch(err=>{console.error('Service worker registration failed',err);toast('Offline support could not start. Check GitHub Pages deployment.');}));}
render();
})();
</script></body></html>
