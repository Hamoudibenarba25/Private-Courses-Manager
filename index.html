let undoStack=JSON.parse(localStorage.getItem('ptm_undo_v1')||'[]'),redoStack=JSON.parse(localStorage.getItem('ptm_redo_v1')||'[]');let lastSavedState=JSON.stringify(data);
function auditChanges(before,after){
 try{const old=JSON.parse(before||'{}'),collections=['students','groups','sessions','payments','obligations','receipts','settlements','teacherLoans','refunds'];const changes=[];for(const key of collections){const a=old[key]||[],b=after[key]||[],am=new Map(a.map(x=>[x.id,JSON.stringify(x)])),bm=new Map(b.map(x=>[x.id,JSON.stringify(x)]));for(const [id,val] of bm){if(!am.has(id))changes.push({entity:key,recordId:id,action:'created'});else if(am.get(id)!==val)changes.push({entity:key,recordId:id,action:'updated'});}for(const [id] of am)if(!bm.has(id))changes.push({entity:key,recordId:id,action:'deleted'});}
 if(changes.length){after.auditLog=after.auditLog||[];after.auditLog.unshift({id:uid(),at:new Date().toISOString(),actor:after.settings?.teacher||'Local user',summary:changes.map(x=>`${x.action} ${x.entity}`).join('; '),changes});after.auditLog=after.auditLog.slice(0,500);}
 }catch(e){console.warn('Audit log could not be written',e)}
}
function save(msg=true){const before=lastSavedState,changed=JSON.stringify(data)!==before;if(changed){auditChanges(before,data);const now=JSON.stringify(data);undoStack.push(before);undoStack=undoStack.slice(-40);redoStack=[];localStorage.setItem('ptm_undo_v1',JSON.stringify(undoStack));localStorage.setItem('ptm_redo_v1','[]');lastSavedState=now;localStorage.setItem(DBKEY,now);}else localStorage.setItem(DBKEY,JSON.stringify(data));makeBackup();updateHistoryButtons();if(msg)toast(T('saved'));}

function makeBackup(){try{let b=JSON.parse(localStorage.getItem(BACKKEY)||'[]');let stamp=new Date().toISOString();let snapshot={id:uid(),date:stamp,data:JSON.parse(JSON.stringify(data))};if(!b.length||JSON.stringify(b[0].data)!==JSON.stringify(data)){b.unshift(snapshot);b=b.slice(0,MAXBACK);localStorage.setItem(BACKKEY,JSON.stringify(b));try{if(window.ptmNative?.backupSnapshot)window.ptmNative.backupSnapshot(JSON.stringify(snapshot));else if(window.Capacitor?.Plugins?.Filesystem){const fs=window.Capacitor.Plugins.Filesystem;fs.mkdir({path:'PTM-Backups',directory:'DOCUMENTS',recursive:true}).catch(()=>{});fs.writeFile({path:'PTM-Backups/'+snapshot.id+'.json',data:JSON.stringify(snapshot),directory:'DOCUMENTS',encoding:'utf8'}).catch(()=>{});}}catch(nativeErr){console.warn('Native backup bridge unavailable',nativeErr)}}}catch(e){console.warn('Backup unavailable',e)}}
function T(k){return (tr[lang]&&tr[lang][k])||tr.en[k]||k}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let el=$('#toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}function group(id){return data.groups.find(x=>x.id===id)}function student(id){return data.students.find(x=>x.id===id)}function activeStudents(gid){return data.students.filter(s=>s.active!==false&&(!gid||s.groupId===gid))}function sessionsFor(gid){return data.sessions.filter(s=>s.groupId===gid&&!s.individualFor).length}function totalPaid(obid){return data.payments.filter(p=>p.obligationId===obid).reduce((a,p)=>a+Number(p.amount),0)}function remaining(o){return Math.max(0,Number(o.amount||0)-totalPaid(o.id))}function status(o){if(o.exempt)return 'exempt';let r=remaining(o);return r<=0?'paid':r<o.amount?'partial':'unpaid'}function obligationLabel(o){let s=student(o.studentId),g=group(o.groupId);return `${s?.name||'—'} · ${g?.name||'—'} · ${o.label||o.type}`}
function addObligation(obj){if(data.obligations.some(o=>o.cycleKey===obj.cycleKey&&o.studentId===obj.studentId&&o.type===obj.type))return;data.obligations.push({id:uid(),createdAt:new Date().toISOString(),...obj});}
function syncCycles(gid){let g=group(gid);if(!g)return;
// Private courses: never create individual payment obligations automatically. The group page only alerts the teacher after each four completed sessions; the teacher records each student's payment manually.
if(g.type==='private')return;
// CEFR: course-fee obligations are generated after each completed 16-session block.
let count=sessionsFor(gid),block=16,n=Math.floor(count/block);for(let c=1;c<=n;c++){let key=`${gid}:cefr:${c}`;activeStudents(gid).forEach(s=>{if(c*block<=Number(s.joinedAtSession||0))return;let amount=Number(s.courseFee??g.courseFee??0),exempt=!!s.feeExempt,type='cefr';let existing=data.obligations.find(o=>o.cycleKey===key&&o.studentId===s.id&&o.type===type);if(existing){if(totalPaid(existing.id)===0){existing.amount=exempt?0:amount;existing.exempt=exempt;}return;}if(!exempt&&amount<=0)return;addObligation({cycleKey:key,groupId:gid,studentId:s.id,type,cycle:c,label:`${T('cefrCycle')} ${c}`,amount:exempt?0:amount,exempt,sessionFrom:(c-1)*block+1,sessionTo:c*block});});}}

function studentSessionLedger(st,g,sessions){
 const attended=sessions.filter(x=>['present','late'].includes(x.attendance?.[st.id])).sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||'').localeCompare(b.createdAt||''));
 const payments=data.payments.filter(p=>p.studentId===st.id&&p.groupId===g.id&&['private','revision','debt'].includes(p.category)).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.createdAt||'').localeCompare(b.createdAt||''));
 const covered=new Set(); payments.forEach(p=>(p.sessionIds||[]).forEach(id=>covered.add(id)));
 // Cycle payments cover attended sessions at the per-session rate (cycle fee / 4), not the whole cycle fee.
 if(g.type==='private'){const size=4,fee=privateCycleFee(st,g),perSession=fee/4;for(let c=1;c<=Math.ceil(sessions.length/size);c++){if(perSession<=0)continue;const block=sessions.slice((c-1)*size,c*size).filter(x=>['present','late'].includes(x.attendance?.[st.id]));const paid=payments.filter(p=>!p.voided&&Number(p.cycleNumber)===c&&['private','revision'].includes(p.category)).reduce((a,p)=>a+Number(p.amount||0),0)+payments.filter(p=>!p.voided&&p.category==='debt'&&Number(p.originalCycleNumber)===c).reduce((a,p)=>a+Number(p.amount||0),0);let credits=Math.min(block.length,Math.floor((paid+0.00001)/perSession));for(const x of block){if(credits<=0)break;if(!covered.has(x.id)){covered.add(x.id);credits--;}}}}
 let prepaidTotal=0,prepaidUsed=0;
 for(const p of payments){let credits=Math.max(0,Math.floor(Number(p.prepaidSessions||0)));prepaidTotal+=credits;if(!credits)continue;const eligible=attended.filter(x=>!covered.has(x.id)&&(!p.date||x.date>=p.date));for(const session of eligible){if(credits<=0)break;covered.add(session.id);credits--;prepaidUsed++;}}
 const unpaid=attended.filter(x=>!covered.has(x.id));
 return {attended,unpaid,covered,prepaidRemaining:Math.max(0,prepaidTotal-prepaidUsed),prepaidTotal,prepaidUsed};
}
function groupFinancials(gid){let ps=data.payments.filter(p=>p.groupId===gid),g=group(gid),priv=ps.filter(p=>p.category==='private').reduce((a,p)=>a+Number(p.amount||0),0),rev=ps.filter(p=>p.category==='revision').reduce((a,p)=>a+Number(p.amount||0),0),cefr=ps.filter(p=>p.category==='cefr').reduce((a,p)=>a+Number(p.amount||0),0),books=ps.filter(p=>p.category==='book').reduce((a,p)=>a+Number(p.amount||0),0),share=Number(g?.revisionTeacherShare??75)/100,total=priv+rev+cefr+books;return {priv,rev,cefr,books,total,teacher:priv*.75+rev*share+cefr*.30+books,school:priv*.25+rev*(1-share)+cefr*.70};}

function renderCycles(v){

function cycleFinancialRows(g){const all=data.sessions.filter(x=>x.groupId===g.id).sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||'').localeCompare(b.createdAt||''));const size=g.type==='private'?4:g.type==='cefr'?16:0;const maxPaidCycle=data.payments.filter(p=>p.groupId===g.id&&!p.voided).reduce((m,p)=>Math.max(m,Number(p.cycleNumber||0)),0);const n=size?Math.max(1,Math.ceil(all.length/size),maxPaidCycle):Math.max(1,all.length,maxPaidCycle);return Array.from({length:n},(_,i)=>{const ss=size?all.slice(i*size,(i+1)*size):all.slice(i,i+1),ids=new Set(ss.map(x=>x.id));const ps=data.payments.filter(p=>p.groupId===g.id&&Number(p.amount)>0&&!p.voided&&(!(p.purpose==='prepayment')||ss.length>0)&&((p.category==='debt'&&Number(p.cycleNumber)===i+1)||(['private','revision'].includes(p.category)&&Number(p.cycleNumber)===i+1)||((p.category||'')!=='debt'&&!['private','revision'].includes(p.category)&&(p.sessionIds||[]).some(id=>ids.has(id)))||((p.category==='cefr')&&Number(data.obligations.find(o=>o.id===p.obligationId)?.cycle||p.cycleNumber)===i+1)||(['book','insurance','school','insurance-school'].includes(p.category)&&Number(p.cycleNumber)===i+1)));const ordinary=ps.filter(p=>p.category!=='debt'),debt=ps.filter(p=>p.category==='debt');const ordinaryReceived=ordinary.reduce((a,p)=>a+Number(p.amount||0),0),debtRecovered=debt.reduce((a,p)=>a+Number(p.amount||0),0),received=ordinaryReceived+debtRecovered;const rate=g.type==='private'?.75:g.type==='cefr'?.30:Number(g.revisionTeacherShare??75)/100;let teacher=0,partner=0,schoolOnly=0;for(const p of ps){const amt=Number(p.amount||0);if(p.category==='book'){teacher+=amt;continue;}if(['insurance','school','insurance-school'].includes(p.category)){partner+=amt;schoolOnly+=amt;continue;}teacher+=amt*rate;partner+=amt*(1-rate);}return {no:i+1,sessionCount:ss.length,sessionIds:[...ids],ordinaryReceived,debtRecovered,received,teacher,partner,schoolOnly,transactions:ps};});}

function teacherLoanAutoRemaining(l){return l.repaymentMode==='manual'?0:teacherLoanRemaining(l);}
function renderTeacherPayments(v){const loans=data.teacherLoans||[];const loanBalance=loans.reduce((a,l)=>a+teacherLoanRemaining(l),0);v.innerHTML=`<div class="between"><h2 class="section-title">Teacher payments & settlements</h2><button class="btn primary" data-action="add-teacher-loan">＋ Record teacher loan</button></div><div class="card"><h3 class="section-title">Teacher loans / advances</h3><p><strong>Outstanding loan balance: ${money(loanBalance)}</strong></p>${loans.map(l=>`<div class="between" style="padding:10px 0;border-bottom:1px solid var(--line)"><div><strong>${esc(l.date)} · ${esc(l.note||'Loan / advance')}</strong><div class="muted">Original ${money(l.amount)} · Payroll deductions ${money(l.deducted||0)} · Manually settled ${money(l.manuallySettled||0)} · Remaining ${money(teacherLoanRemaining(l))} · Repayment: ${l.repaymentMode==='manual'?'Manual / cash':'Automatic earnings deduction'}</div></div><div class="row">${teacherLoanRemaining(l)>0?`<button class="btn small" data-action="manual-settle-loan" data-id="${l.id}">Settle manually</button>`:''}<button class="btn small danger" data-action="delete-teacher-loan" data-id="${l.id}">Delete</button></div></div>`).join('')||'No loans recorded.'}</div>${data.groups.map(g=>`<div class="card" style="margin-top:14px"><h3>${esc(g.name)}</h3>${cycleFinancialRows(g).map(c=>{const settled=data.settlements.find(x=>x.groupId===g.id&&x.cycleNo===c.no);const remainingLoans=loans.reduce((a,l)=>a+teacherLoanAutoRemaining(l),0),deduction=Math.min(remainingLoans,c.teacher),teacherNet=Math.max(0,c.teacher-deduction);return `<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div class="between"><div><strong>Cycle ${c.no}</strong><div>Received ${money(c.received)} · Current-cycle receipts ${money(c.ordinaryReceived)} · Previous debt recovered ${money(c.debtRecovered)}</div><div>Teacher share ${money(c.teacher)} · Partner share ${money(c.partner)} · Teacher loan deduction ${money(deduction)}</div><div>Teacher net payable ${money(teacherNet)} · Partner payable ${money(c.partner)}</div>${settled?`<span class="badge green">Teacher: ${settled.teacherPaid?'Received':'Pending'} · Partner: ${settled.partnerPaid?'Received':'Pending'}</span>`:`<span class="badge amber">${c.sessionCount?'Completed / in progress — verify cycle before settlement':'No sessions recorded'}</span>`}</div><div class="row"><button class="btn small" data-action="cycle-financial-report" data-group="${g.id}" data-cycle="${c.no}">View statement</button><button class="btn small primary" data-action="settle-party" data-party="teacher" data-group="${g.id}" data-cycle="${c.no}" ${settled?.teacherPaid||c.received<=0||((g.type==='private'||g.type==='cefr')&&c.sessionCount<(g.type==='private'?4:16))?'disabled':''}>Record teacher payment</button><button class="btn small primary" data-action="settle-party" data-party="partner" data-group="${g.id}" data-cycle="${c.no}" ${settled?.partnerPaid||c.received<=0||((g.type==='private'||g.type==='cefr')&&c.sessionCount<(g.type==='private'?4:16))?'disabled':''}>Record partner payment</button></div></div></div>`}).join('')}</div>`).join('')}`;}
function cycleStatementHtml(g,c){const debts=[];for(const st of activeStudents(g.id)){if(['private','revision'].includes(g.type)){const size=privateCycleSize(g)||4,all=data.sessions.filter(x=>x.groupId===g.id).sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||'').localeCompare(b.createdAt||''));for(let n=1;n<c.no;n++){const due=privateCycleDebt(st,g,n);if(due>0){const block=all.slice((n-1)*size,n*size),att=block.filter(x=>['present','late'].includes(x.attendance?.[st.id]));debts.push({name:st.name,cycle:`Cycle ${n}`,sessions:att.length,amount:due});}}}else{data.obligations.filter(o=>o.studentId===st.id&&remaining(o)>0).forEach(o=>debts.push({name:st.name,cycle:o.cycle||'CEFR block',sessions:'—',amount:remaining(o)}));}}const settled=data.settlements.find(x=>x.groupId===g.id&&x.cycleNo===c.no)||{};return `<div class="school">${esc(data.settings.school||'Teaching Manager')}</div><h2>Cycle ${c.no} financial statement — ${esc(g.name)}</h2><p>Generated: ${today()} · Course: ${esc(g.type)}</p><table><tr><th>Current-cycle payments received</th><td>${money(c.ordinaryReceived)}</td></tr><tr><th>Previous-cycle debts recovered</th><td>${money(c.debtRecovered)}</td></tr><tr><th>Total actual receipts</th><td>${money(c.received)}</td></tr><tr><th>Teacher share</th><td>${money(c.teacher)}</td></tr><tr><th>Partner share</th><td>${money(c.partner)}</td></tr><tr><th>School-only charges</th><td>${money(c.schoolOnly)}</td></tr><tr><th>Teacher loans deducted / to deduct</th><td>${money(settled.loanDeduction??Math.min((data.teacherLoans||[]).reduce((a,l)=>a+teacherLoanAutoRemaining(l),0),c.teacher))}</td></tr><tr><th>Teacher actually received</th><td>${money(settled.teacherReceived||0)}</td></tr><tr><th>Partner actually received</th><td>${money(settled.partnerReceived||0)}</td></tr></table><h3>Payment transactions recorded in this cycle</h3><table><tr><th>Student</th><th>Type</th><th>Payment date</th><th>Amount</th><th>Original cycle / sessions</th></tr>${c.transactions.map(p=>`<tr><td>${esc(student(p.studentId)?.name||'—')}</td><td>${p.category==='debt'?'Debt recovery':esc(p.category||'Course fee')}</td><td>${esc(p.date||'—')}</td><td>${money(p.amount)}</td><td>${p.category==='debt'?`Debt from Cycle ${Number(p.originalCycleNumber||0)}${Number(p.cycleNumber||0)!==Number(p.originalCycleNumber||0)?' · allocated to Cycle '+Number(p.cycleNumber||0):''}`:esc((p.sessionDates||[]).join(', ')||`Cycle ${Number(p.cycleNumber||c.no)}${p.purpose==='prepayment'?' prepayment':''}`)}</td></tr>`).join('')||'<tr><td colspan="5">No payments received.</td></tr>'}</table><h3>Outstanding student debts</h3><table><tr><th>Student</th><th>Cycle</th><th>Unpaid sessions</th><th>Amount owed</th></tr>${debts.map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(d.cycle)}</td><td>${d.sessions}</td><td>${money(d.amount)}</td></tr>`).join('')||'<tr><td colspan="4">No outstanding debts identified.</td></tr>'}</table><div class="signrow"><div class="sign">Received by teacher: ${esc(data.settings.teacher||'')}<br>Signature: __________________</div><div class="sign">Received by partner<br>Signature: __________________</div></div>`;}
function recordSettlementPart(gid,no,party){const g=group(gid),c=cycleFinancialRows(g||{}).find(x=>x.no===Number(no));if(!g||!c)return;const required=g.type==='private'?4:g.type==='cefr'?16:0;if(c.received<=0){toast('No money has been received for this cycle. Settlement is unavailable.');return;}if(required&&c.sessionCount<required){toast('This cycle is not complete yet.');return;}let row=data.settlements.find(x=>x.groupId===gid&&x.cycleNo===Number(no));if(!row){row={id:uid(),groupId:gid,cycleNo:Number(no),date:today(),teacherPaid:false,partnerPaid:false,teacherReceived:0,partnerReceived:0,loanDeduction:0};data.settlements.push(row);}if(party==='teacher'){if(row.teacherPaid){toast('Teacher payment for this cycle is already recorded.');return;}const outstanding=(data.teacherLoans||[]).reduce((a,l)=>a+teacherLoanRemaining(l),0);const deduction=Math.min(outstanding,c.teacher);let left=deduction;for(const l of data.teacherLoans){const take=Math.min(teacherLoanAutoRemaining(l),left);l.deducted=Number(l.deducted||0)+take;left-=take;if(!left)break;}row.loanDeduction=deduction;row.teacherShare=c.teacher;row.teacherReceived=Math.max(0,c.teacher-deduction);row.teacherPaid=true;row.teacherPaidDate=today();}else{if(row.partnerPaid){toast('Partner payment for this cycle is already recorded.');return;}row.partnerShare=c.partner;row.partnerReceived=c.partner;row.partnerPaid=true;row.partnerPaidDate=today();}row.date=today();save(false);render();const latest=cycleFinancialRows(g).find(x=>x.no===Number(no));const saved=data.settlements.find(x=>x.groupId===gid&&x.cycleNo===Number(no));printHtmlReport('Cycle settlement',cycleStatementHtml(g,latest));}
function showCycleFinancialReport(gid,no){const g=group(gid),c=cycleFinancialRows(g||{}).find(x=>x.no===Number(no));if(!g||!c)return;printHtmlReport('Cycle financial statement',cycleStatementHtml(g,c));}
function addTeacherLoan(){const body=`<form id="loanForm"><div class="field"><label>Date</label><input name="date" type="date" value="${today()}"></div><div class="field"><label>Amount</label><input name="amount" type="number" min="1" required></div><div class="field"><label>Reason</label><input name="note"></div><div class="field"><label>Repayment method</label><select name="repaymentMode"><option value="auto">Automatically deduct from future teacher earnings</option><option value="manual">Manual / cash settlement (do not deduct from earnings)</option></select></div></form>`;modal('Record teacher loan / advance',body,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="saveLoan">Save</button>`);$('#saveLoan').onclick=()=>{const f=new FormData($('#loanForm'));data.teacherLoans.push({id:uid(),date:f.get('date'),amount:Number(f.get('amount')),note:f.get('note')||'',repaymentMode:f.get('repaymentMode')||'auto',deducted:0,manuallySettled:0});save(false);closeModal();render();};}
function manuallySettleTeacherLoan(id){const l=data.teacherLoans.find(x=>x.id===id);if(!l)return;const remaining=teacherLoanRemaining(l);if(!remaining){toast('This advance is already settled.');return;}if(!confirm(`Confirm that ${money(remaining)} was repaid directly in cash / manually, outside teacher earnings? This will close the outstanding balance without deducting it from any future teacher payment.`))return;l.manuallySettled=Number(l.manuallySettled||0)+remaining;l.manualSettlementDate=today();l.manualSettlementMethod='cash/manual';save(false);render();toast('Loan marked as manually settled; teacher earnings were not reduced.');}
function deleteTeacherLoan(id){const l=data.teacherLoans.find(x=>x.id===id);if(!l)return;if(!confirm(`Delete this teacher loan / advance (${money(l.amount)})? This removes it from outstanding balances. Existing recorded payroll deductions and settlement history will not be rewritten.`))return;data.teacherLoans=data.teacherLoans.filter(x=>x.id!==id);save(false);render();toast('Teacher loan record deleted.');}
function settleCycle(gid,no){const g=group(gid),c=cycleFinancialRows(g||{}).find(x=>x.no===Number(no));if(!g||!c)return;let left=data.teacherLoans.reduce((a,l)=>a+teacherLoanAutoRemaining(l),0),ded=Math.min(left,c.teacher);for(const l of data.teacherLoans){const take=Math.min(teacherLoanAutoRemaining(l),ded);l.deducted+=take;ded-=take;if(!ded)break;}const row={id:uid(),groupId:gid,cycleNo:Number(no),date:today(),teacherShare:c.teacher,partnerShare:c.partner,teacherReceived:Math.max(0,c.teacher-Math.min(left,c.teacher)),partnerReceived:c.partner,loanDeduction:Math.min(left,c.teacher)};data.settlements.push(row);save(false);render();printHtmlReport('Cycle settlement',`<h2>Cycle settlement</h2><p>Group ${esc(g.name)} · Cycle ${no} · ${today()}</p><p>Received by teacher: ${money(row.teacherReceived)} (share ${money(c.teacher)})</p><p>Received by partner: ${money(row.partnerReceived)}</p><p>Loan deduction: ${money(row.loanDeduction)}</p><p>Teacher signature: __________________ Partner signature: __________________</p>`);}

e')||0),courseFee:Number(fd.get('courseFee')||0),revisionSessionFee:Number(fd.get('revisionSessionFee')||0),revisionTeacherShare:Number(fd.get('revisionTeacherShare')||75)};if(g)Object.assign(g,obj);else data.groups.push(obj);syncCycles(obj.id);save();closeModal();render();};}

ns.find(x=>x.groupId===gid&&!x.individualFor&&x.date===date);if(existing){existing.attendance=existing.attendance||{};Object.entries(attendance).forEach(([sid,state])=>{if(state)existing.attendance[sid]=state;});if(fd.get('notes'))existing.notes=existing.notes||fd.get('notes');save(false);closeModal();render();toast('A session already existed on this date. Only explicitly marked attendance was added; no duplicate session was created.');return;}Object.keys(attendance).forEach(sid=>{if(!attendance[sid])attendance[sid]='present';});data.sessions.push({id:uid(),groupId:gid,date,duration:Number(fd.get('duration')||0),notes:fd.get('notes'),attendance,createdAt:new Date().toISOString()});syncCycles(gid);save(false);closeModal();render();toast(gid&&group(gid)?.type==='private'&&sessionsFor(gid)%4===0?'Four group sessions completed. Review the group and record each student payment manually.':T('sessionSaved'));};}
function privateCycleSize(g){return g?.type==='private'?4:g?.type==='cefr'?16:0;}
function groupCycleNo(gid){const g=group(gid),size=privateCycleSize(g);if(!g||!size)return 1;const n=data.sessions.filter(x=>x.groupId===gid&&!x.individualFor).length;return Math.max(1,Math.floor(Math.max(0,n-1)/size)+1);}
function privateCyclePayments(stId,gid,cycleNo){return data.payments.filter(p=>p.studentId===stId&&p.groupId===gid&&Number(p.cycleNumber||0)===Number(cycleNo)&&['private','revision'].includes(p.category)&&!p.voided).reduce((a,p)=>a+Number(p.amount||0),0);}
function privateCycleFee(st,g){return Number(st?.privateFee??g?.defaultFee??0);}
function privateCycleSessions(g,cycleNo){const size=privateCycleSize(g)||4;const ss=data.sessions.filter(x=>x.groupId===g.id&&!x.individualFor).sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||'').localeCompare(b.createdAt||''));return ss.slice((Number(cycleNo)-1)*size,Number(cycleNo)*size);}
function privateCycleAttendedCount(st,g,cycleNo){return privateCycleSessions(g,cycleNo).filter(x=>['present','late'].includes(x.attendance?.[st.id])).length;}
function privateCycleAmountDue(st,g,cycleNo){if(g?.type==='revision')return privateCycleAttendedCount(st,g,cycleNo)*Number(st.revisionSessionFee??g.revisionSessionFee??g.defaultFee??0);return privateCycleAttendedCount(st,g,cycleNo)*(privateCycleFee(st,g)/4);}
function privateCycleDebt(st,g,cycleNo){const attended=privateCycleAttendedCount(st,g,cycleNo);if(!attended)return 0;const due=privateCycleAmountDue(st,g,cycleNo);const normal=privateCyclePayments(st.id,g.id,cycleNo);const recovered=data.payments.filter(p=>p.studentId===st.id&&p.groupId===g.id&&p.category==='debt'&&Number(p.originalCycleNumber)===Number(cycleNo)&&!p.voided).reduce((a,p)=>a+Number(p.amount||0),0);return Math.max(0,due-normal-recovered);}

 $('#savePrivatePayment').onclick=()=>{const f=$('#privatePaymentForm');if(!f.reportValidity())return;const fd=new FormData(f),st=student(fd.get('studentId')),cycleNo=Number(fd.get('cycleNumber')),amt=Number(fd.get('amount')),fee=privateCycleAmountDue(st,g,cycleNo),paid=privateCyclePayments(st.id,gid,cycleNo),fullFee=isRevision?fee:privateCycleFee(st,g),balance=Math.max(0,fullFee-paid);if(!st||amt<=0||!Number.isInteger(cycleNo)){toast('Check the student, cycle and amount.');return;}if(fullFee<=0){toast('Set the group or student cycle fee first.');return;}if(amt>balance){toast(`This cycle can receive up to ${money(balance)} more, including payment for the remaining session(s). Older-cycle debts must be recorded separately.`);return;}const purpose=fd.get('purpose');if(purpose==='prepay'&&cycleNo<=current){toast('Choose a future cycle for a prepayment.');return;}if(purpose==='cycle'&&cycleNo>current){toast('Choose “Prepay a future cycle” for a future cycle.');return;}if(purpose==='cycle'&&cycleNo<current){toast('Previous cycles must be paid through “Pay Previous Debts”.');return;}

e'delete-payment':deletePayment(id);break;case'profile-delete-session':deleteStudentSession(id,b.dataset.session);break;case'add-teacher-loan':addTeacherLoan();break;case'manual-settle-loan':manuallySettleTeacherLoan(id);break;case'delete-teacher-loan':deleteTeacherLoan(id);break;case'settle-party':recordSettlementPart(b.dataset.group,b.dataset.cycle,b.dataset.party);break;case'cycle-financial-report':showCycleFinancialReport(b.dataset.group,b.dataset.cycle);break;case'record-debt-payment':recordDebtPayment(id);break;}});
$('#quickSession').onclick=sessionForm;$('#language').onchange=e=>{lang=e.target.value;localStorage.setItem('ptm_language',lang);render();};$('#modalClose').onclick=closeModal;$('#modalback').addEventListener('click',e=>{if(e.target===$('#modalback')){closeModal();return;}let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;if(a==='profile-pay'){closeModal();recordPaymentForm(null,id);}else if(a==='profile-book'){closeModal();addBookForm(id);}else if(a==='edit-student'){closeModal();studentForm(id);}});

// v1.6.0: student-centric session ledger, individual attendance catch-up and filtered session reports.
function profile(id){
 const st=student(id); if(!st)return; const g=group(st.groupId); if(!g)return;
 const all=[...data.sessions].filter(x=>x.groupId===g.id).sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||'').localeCompare(b.createdAt||''));
 const ledger=studentSessionLedger(st,g,all); const paidIds=new Set(ledger.covered);
 const history=all.map(x=>({x,att:x.attendance?.[id],attended:['present','late'].includes(x.attendance?.[id])})).filter(z=>z.attended);
 const unpaid=ledger.unpaid;
 const payments=data.payments.filter(p=>p.studentId===id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 const fee=Number(st.privateFee??g.defaultFee??0), duePer=fee/4;
 const sessionRows=history.map(({x})=>`<tr><td>${esc(x.date)}</td><td>${esc(x.notes||'—')}</td><td><span class="badge ${paidIds.has(x.id)?'green':'amber'}">${paidIds.has(x.id)?T('paid'):T('unpaid')}</span></td><td><button class="btn small" data-action="profile-delete-session" data-id="${id}" data-session="${x.id}">${paidIds.has(x.id)?'—':'Delete'}</button></td></tr>`).join('');
 const selectable=all.filter(x=>!['present','late'].includes(x.attendance?.[id]));
 const body=`<div class="between"><div><h3 style="margin:0">${esc(st.name)}</h3><div class="muted">${esc(g.name)} · ${esc(st.studentCode||'')}</div></div><span class="badge green">${T('active')}</span></div>
 <div class="grid three" style="margin:15px 0"><div class="card"><div class="muted">${T('sessionsDone')}</div><strong>${ledger.attended.length}</strong></div><div class="card"><div class="muted">${T('paid')}</div><strong>${ledger.attended.length-unpaid.length}</strong></div><div class="card"><div class="muted">${T('unpaid')}</div><strong>${unpaid.length}</strong></div></div>
 <div class="card" style="margin-bottom:14px"><div class="between"><h4 style="margin:0">${T('attendance')} & ${T('paymentHistory')}</h4><button class="btn small primary" data-action="profile-pay" data-id="${id}">${T('recordPayment')}</button></div><p class="muted">${T('group')}: ${esc(g.name)} · ${T('subject')}: ${T('englishLanguage')}</p>
 ${['private','revision'].includes(g.type)?`<p>${T('unpaid')}: <strong>${unpaid.length}</strong> · ${T('amount')}: <strong>${money(unpaid.length*duePer)}</strong></p>`:''}
 <div class="tablewrap"><table><thead><tr><th>${T('date')}</th><th>${T('notes')}</th><th>${T('status')}</th><th>${T('actions')}</th></tr></thead><tbody>${sessionRows||`<tr><td colspan="4">${T('noData')}</td></tr>`}</tbody></table></div>
 <div class="formgrid" style="margin-top:12px"><div class="field"><label>${T('addSession')} / ${T('attendance')}</label><select id="profileExistingSession"><option value="">${T('choose')}</option>${selectable.map(x=>`<option value="${x.id}">${esc(x.date)} · ${esc(x.notes||'Group session')}</option>`).join('')}</select></div><div class="field" style="align-content:end"><button class="btn" data-action="profile-add-attendance" data-id="${id}">${T('markAttendance')}</button></div></div>
 <div class="formgrid"><div class="field"><label>${T('date')}</label><input type="date" id="profileIndividualDate" value="${today()}"></div><div class="field"><label>${T('notes')}</label><input id="profileIndividualNote" placeholder="Individual catch-up session"></div></div><button class="btn primary" data-action="profile-individual-session" data-id="${id}">${T('addSession')} — ${T('studentProfile')}</button></div>
 <h4>${T('paymentHistory')}</h4>${payments.map(p=>`<div class="between" style="padding:7px 0;border-bottom:1px solid var(--line)"><span>${esc(p.date)} · ${esc(p.category)} · ${esc((p.sessionDates||[]).join(', '))}</span><strong>${money(p.amount)}</strong></div>`).join('')||T('noData')}
 <div class="row" style="margin-top:15px"><button class="btn" data-action="profile-book" data-id="${id}">${T('addBook')}</button></div>`;
 modal(T('studentProfile'),body,`<button class="btn" data-close>${T('cancel')}</button><button class="btn primary" data-action="edit-student" data-id="${id}">${T('edit')}</button>`);
}

function renderCycles(v){
 const groups=data.groups;let gid=window.ptmCycleGroup||groups[0]?.id||'';if(!groups.some(g=>g.id===gid))gid=groups[0]?.id||'';let g=group(gid);let target=g?.type==='private'?4:g?.type==='cefr'?16:0;
 let all=g?[...data.sessions].filter(x=>x.groupId===g.id&&!x.individualFor).sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||'').localeCompare(b.createdAt||'')):[];
 let maxPaidCycle=data.payments.filter(p=>p.groupId===g.id&&!p.voided).reduce((m,p)=>Math.max(m,Number(p.cycleNumber||0)),0);let count=target?Math.max(1,Math.ceil(all.length/target),maxPaidCycle):Math.max(1,all.length,maxPaidCycle);let cycleNo=Math.min(Math.max(1,Number(window.ptmCycleNo||count)),count);let sessions=target?all.slice((cycleNo-1)*target,cycleNo*target):all;let slots=target?Array.from({length:target},(_,i)=>sessions[i]||null):sessions;
 const cycleStudents=g?activeStudents(g.id):[];
 const rows=cycleStudents.map(st=>{let attended=sessions.filter(x=>['present','late'].includes(x.attendance?.[st.id]));let dates=slots.map(x=>{let ok=x&&['present','late'].includes(x.attendance?.[st.id]);return `<td>${ok?esc(x.date):'<span class="muted">—</span>'}</td>`}).join('');let ledger=studentSessionLedger(st,g,all);let paidInCycle=0;let fee=Number(st.privateFee??g.defaultFee??0);let cefrOb=data.obligations.find(o=>o.groupId===g.id&&o.studentId===st.id&&o.type==='cefr'&&Number(o.cycle)===cycleNo);if(g.type==='cefr'){paidInCycle=cefrOb&&remaining(cefrOb)===0?sessions.length:0;}else{paidInCycle=privateCyclePayments(st.id,g.id,cycleNo); }let amount=g.type==='private'?privateCycleAmountDue(st,g,cycleNo):g.type==='cefr'?Number(st.courseFee??g.courseFee??0):Number(st.revisionSessionFee??g.revisionSessionFee??g.defaultFee??0)*attended.length;let debtRecoveredHere=data.payments.filter(p=>p.studentId===st.id&&p.groupId===g.id&&p.category==='debt'&&Number(p.originalCycleNumber)===cycleNo&&!p.voided).reduce((a,p)=>a+Number(p.amount||0),0);let unpaid=g.type==='cefr'?(cefrOb&&remaining(cefrOb)===0?0:1):Math.max(0,amount-paidInCycle-debtRecoveredHere);let paid=unpaid===0&&(paidInCycle+debtRecoveredHere)>0;let payBtn=`<button class="btn small primary" data-action="group-student-pay" data-id="${st.id}" data-group="${g.id}">${T('recordPayment')}</button>`;return `<tr><td><strong>${esc(st.name)}</strong><div class="muted">${esc(st.phone||'')}</div></td>${dates}<td><span class="badge ${paid?'green':'amber'}">${paid?T('paid'):T('unpaid')}</span><div class="muted">${money(paidInCycle+debtRecoveredHere)} received including debt recovery</div>${g.type==='private'&&cycleNo>1&&privateCycleDebt(st,g,cycleNo-1)>0?`<span class="badge red">Previous debt: ${money(privateCycleDebt(st,g,cycleNo-1))}</span>`:''}</td><td>${money(amount)}</td><td>${payBtn} <button class="btn small" data-action="profile" data-id="${st.id}">${T('studentProfile')}</button></td></tr>`}).join('');
 let headers=slots.map((x,i)=>`<th>${T('sessionCount')} ${i+1}<div class="muted" style="font-weight:400">${x?esc(x.date):'—'}</div></th>`).join('');
 v.innerHTML=`<div class="between"><div><h2 class="section-title">${T('cycles')}</h2><div class="muted">${T('cyclePageIntro')}</div></div></div><div class="card"><div class="toolbar"><label>${T('group')}</label><select id="cycleGroup">${groups.map(x=>`<option value="${x.id}" ${x.id===gid?'selected':''}>${esc(x.name)} · ${T(x.type==='private'?'private':x.type==='cefr'?'cefr':'revision')}</option>`).join('')}</select><label>${T('cycleNumber')}</label><select id="cycleNo">${Array.from({length:count},(_,i)=>`<option value="${i+1}" ${i+1===cycleNo?'selected':''}>${i+1}</option>`).join('')}</select><button class="btn primary" id="cyclePrint">${T('cycleReport')}</button></div><div class="notice">${g?(g.type==='private'?'Private courses: 4 group sessions per cycle.':g.type==='cefr'?'CEFR: 16 programme sessions per cycle.':'Revision courses: flexible, open cycle.') :T('noGroup')}</div>${g?`<div class="between"><div><strong>${esc(g.name)}</strong><div class="muted">${T('cycleSessions')}: ${sessions.length}${target?` / ${target}`:''} · ${sessions.length>=target&&target?T('cycleClosed'):T('cycleOpen')}</div></div><button class="btn" id="cycleAddStudent">＋ ${T('addStudentToCycle')}</button></div><div class="tablewrap" style="margin-top:12px"><table style="min-width:850px"><thead><tr><th>${T('student')}</th>${headers}<th>${T('status')}</th><th>${T('cycleAmount')}</th><th>${T('actions')}</th></tr></thead><tbody>${rows||`<tr><td colspan="${5+sessions.length}">${T('noData')}</td></tr>`}</tbody></table></div>`:''}</div>`;
 $('#cycleGroup')?.addEventListener('change',e=>{window.ptmCycleGroup=e.target.value;window.ptmCycleNo=1;render();});$('#cycleNo')?.addEventListener('change',e=>{window.ptmCycleNo=Number(e.target.value);render();});$('#cycleAddStudent')?.addEventListener('click',()=>{if(g)studentForm(null,g.id);});
 $('#cyclePrint')?.addEventListener('click',()=>{if(!g)return;let html=`<div class="school">${esc(data.settings.school||'Teaching Manager')}</div><h2>${T('cycleReport')} — ${esc(g.name)}</h2><p>Cycle ${cycleNo} · ${esc(g.type)} · Generated ${today()}</p><table><thead><tr><th>${T('student')}</th>${headers}<th>${T('status')}</th><th>${T('cycleAmount')}</th></tr></thead><tbody>${rows.replace(/<button[^>]*>[\s\S]*?<\/button>/g,'')}</tbody></table>${cycleStatementHtml(g,cycleFinancialRows(g).find(x=>x.no===cycleNo))}`;printHtmlReport('Cycle report',html);});
}

function renderSessions(v){
 const groups=data.groups;v.innerHTML=`<div class="between"><div><h2 class="section-title">${T('sessions')}</h2><div class="muted">${lang==='fr'?'Registre des séances et rapports de présence.':lang==='ar'?'سجل الحصص وتقارير الحضور.':'Session register and attendance reports.'}</div></div><button class="btn primary" data-action="add-session">＋ ${T('addSession')}</button></div>
 <div class="card"><div class="toolbar"><select id="sessionTypeFilter"><option value="">${T('all')} ${T('type')}</option><option value="private">${T('private')}</option><option value="cefr">${T('cefr')}</option><option value="revision">Revision courses</option></select><select id="sessionGroupFilter"><option value="">${T('allGroups')}</option>${groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select><select id="sessionPeriodFilter"><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="four">Four sessions</option></select><input type="date" id="sessionDateFilter" value="${today()}"><button class="btn primary" id="sessionReportRun">${T('generateReceipt')||'Generate report'}</button><button class="btn" id="sessionReportPrint">${T('print')}</button></div><div id="sessionReport"></div></div>
 <div class="card" style="margin-top:14px"><h3 class="section-title">${T('recentSessions')}</h3><div id="sessionRegister"></div></div>`;
 const run=()=>{let typ=$('#sessionTypeFilter').value,gid=$('#sessionGroupFilter').value,period=$('#sessionPeriodFilter').value,d=$('#sessionDateFilter').value||today();let start=d,end=d;if(period==='weekly'){let z=new Date(d+'T12:00:00');z.setDate(z.getDate()-((z.getDay()+6)%7));start=z.toISOString().slice(0,10);z.setDate(z.getDate()+6);end=z.toISOString().slice(0,10);}let ss=data.sessions.filter(x=>(!gid||x.groupId===gid)&&(!typ||group(x.groupId)?.type===typ)&&x.date>=start&&x.date<=end).sort((a,b)=>a.date.localeCompare(b.date));if(period==='four'&&gid){ss=ss.slice(-4);}const html=ss.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(group(x.groupId)?.name||'')}</td><td>${esc(group(x.groupId)?.type||'')}</td><td>${Object.entries(x.attendance||{}).filter(([sid,a])=>['present','late'].includes(a)).map(([sid,a])=>`${esc(student(sid)?.name||'')} (${T(a)})`).join(', ')||'—'}</td><td>${esc(x.notes||'—')}</td></tr>`).join('');$('#sessionReport').innerHTML=`<div class="between"><strong>${ss.length} ${T('sessionsDone')}</strong><span class="muted">${start} – ${end}</span></div><div class="tablewrap"><table><thead><tr><th>${T('date')}</th><th>${T('group')}</th><th>${T('type')}</th><th>${T('attendance')}</th><th>${T('notes')}</th></tr></thead><tbody>${html||`<tr><td colspan="5">${T('noData')}</td></tr>`}</tbody></table></div>`;$('#sessionRegister').innerHTML=$('#sessionReport').innerHTML;};
 ['sessionTypeFilter','sessionGroupFilter','sessionPeriodFilter','sessionDateFilter'].forEach(id=>$('#'+id).addEventListener('change',run));$('#sessionReportRun').onclick=run;$('#sessionReportPrint').onclick=()=>printHtmlReport('Session attendance report',$('#sessionReport').innerHTML);run();
}
// Delegated actions for the student ledger.
$('#modalback').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;if(a==='profile-delete-session'){deleteStudentSession(id,b.dataset.session);return;}if(a==='profile-toggle-session'||a==='profile-add-attendance'){let sid=a==='profile-toggle-session'?b.dataset.session:$('#profileExistingSession')?.value;if(!sid){toast('Choose a group session first.');return;}let ss=data.sessions.find(x=>x.id===sid);if(!ss)return;ss.attendance=ss.attendance||{};ss.attendance[id]='present';save(false);profile(id);toast(T('attendanceUpdated'));}else if(a==='profile-individual-session'){let st=student(id),g=group(st?.groupId);if(!st||!g)return;let d=$('#profileIndividualDate')?.value||today(),note=$('#profileIndividualNote')?.value||T('individualCatchup');let groupSession=data.sessions.filter(x=>x.groupId===g.id&&!x.individualFor&&x.date===d).sort((x,y)=>(x.createdAt||'').localeCompare(y.createdAt||''))[0];if(groupSession){groupSession.attendance=groupSession.attendance||{};groupSession.attendance[id]='present';save(false);profile(id);toast('Attendance added to the existing group session. No new session was created.');return;}let rec=data.sessions.find(x=>x.groupId===g.id&&x.date===d&&x.individualFor===id);if(rec){rec.attendance=rec.attendance||{};rec.attendance[id]='present';}else data.sessions.push({id:uid(),groupId:g.id,date:d,duration:90,notes:note,attendance:{[id]:'present'},individualFor:id,createdAt:new Date().toISOString()});save(false);profile(id);toast(T('individualAdded'));}});

// First-run example group names are intentionally not pre-populated; create only what the teacher actually uses.
if(!localStorage.getItem(DBKEY)){data=blank();localStorage.setItem(DBKEY,JSON.stringify(data));makeBackup();}
$('#undoAction').addEventListener('click',undoChange);$('#redoAction').addEventListener('click',redoChange);updateHistoryButtons();
let deferredInstallPrompt=null;const installBtn=$('#installApp');const isInstalled=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;installBtn.hidden=false;if(isInstalled()){installBtn.textContent='✓ '+T('installed');installBtn.disabled=true;}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;installBtn.hidden=false;installBtn.textContent='⇩ '+T('install');});installBtn.addEventListener('click',async()=>{if(isInstalled()){toast('This app is already installed.');return;}if(deferredInstallPrompt){deferredInstallPrompt.prompt();let choice=await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;if(choice?.outcome==='accepted'){installBtn.textContent='✓ '+T('installed');installBtn.disabled=true;}return;}let msg='To install on Windows Chrome: open ⋮ menu → Cast, save and share → Install page as app (or More tools → Create shortcut, then tick Open as window). On Android Chrome: ⋮ → Install app / Add to Home screen. If this option is missing, check that GitHub Pages is using HTTPS, the manifest and service worker load successfully, then hard-refresh.';modal('Install Private Teaching Manager',`<div class="notice">${esc(msg)}</div><p><strong>App install status:</strong> ${isInstalled()?'Installed':'Not installed in this browser'}.</p><p class="muted">The button remains visible so the installation instructions are always available.</p>`,`<button class="btn primary" data-close>Close</button>`);});window.addEventListener('appinstalled',()=>{installBtn.textContent='✓ '+T('installed');installBtn.disabled=true;toast(T('installed')); });
if('serviceWorker'in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{scope:'./',updateViaCache:'none'}).then(reg=>{reg.update();if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});}).catch(err=>{console.error('Service worker registration failed',err);toast('Offline support could not start. Check GitHub Pages deployment.');}));}
render();
})();
