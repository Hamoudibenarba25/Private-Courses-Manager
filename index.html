function T(k){return (tr[lang]&&tr[lang][k])||tr.en[k]||k}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let el=$('#toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}function group(id){return data.groups.find(x=>x.id===id)}function student(id){return data.students.find(x=>x.id===id)}function activeStudents(gid){return data.students.filter(s=>s.active!==false&&(!gid||s.groupId===gid))}function sessionsFor(gid){return data.sessions.filter(s=>s.groupId===gid).length}function totalPaid(obid){return data.payments.filter(p=>p.obligationId===obid).reduce((a,p)=>a+Number(p.amount),0)}function remaining(o){return Math.max(0,Number(o.amount||0)-totalPaid(o.id))}function status(o){if(o.exempt)return 'exempt';let r=remaining(o);return r<=0?'paid':r<o.amount?'partial':'unpaid'}function obligationLabel(o){let s=student(o.studentId),g=group(o.groupId);return `${s?.name||'—'} · ${g?.name||'—'} · ${o.label||o.type}`}

function syncCycles(gid){let g=group(gid);if(!g)return;
// Private courses: never create individual payment obligations automatically. The group page only alerts the teacher after each four completed sessions; the teacher records each student's payment manually.
if(g.type==='private')return;

let count=sessionsFor(gid),block=16,n=Math.floor(count/block);for(let c=1;c<=n;c++){let key=`${gid}:cefr:${c}`;activeStudents(gid).forEach(s=>{if(c*block<=Number(s.joinedAtSession||0))return;let amount=Number(s.courseFee??g.courseFee??0),exempt=!!s.feeExempt,type='cefr';let existing=data.obligations.find(o=>o.cycleKey===key&&o.studentId===s.id&&o.type===type);if(existing){if(totalPaid(existing.id)===0){existing.amount=exempt?0:amount;existing.exempt=exempt;}return;}if(!exempt&&amount<=0)return;addObligation({cycleKey:key,groupId:gid,studentId:s.id,type,cycle:c,label:`${T('cefrCycle')} ${c}`,amount:exempt?0:amount,exempt,sessionFrom:(c-1)*block+1,sessionTo:c*block});});}}
function startPrivatePayment(studentId,gid){let g=group(gid),st=student(studentId);if(!g||!st)return;if(g.type!=='private'){recordPaymentForm(null,studentId,null,gid);return;}let completed=Math.floor(sessionsFor(gid)/4);if(completed<1){toast('Record four group sessions first.');return;}let chosen=null;for(let c=1;c<=completed;c++){if(c*4<=Number(st.joinedAtSession||0))continue;let key=`${gid}:private:${c}`;let existing=data.obligations.find(o=>o.cycleKey===key&&o.studentId===studentId&&o.type==='private');if(existing&&remaining(existing)>0){chosen=existing;break;}if(!existing){let amount=Number(st.privateFee??g.defaultFee??0);if(amount<=0){toast('Set the group fee or this student’s fee before recording payment.');return;}chosen={id:uid(),cycleKey:key,groupId:gid,studentId,type:'private',cycle:c,label:`Private course cycle ${c}`,amount,exempt:false,sessionFrom:(c-1)*4+1,sessionTo:c*4,createdAt:new Date().toISOString()};data.obligations.push(chosen);save(false);break;}}if(!chosen){toast('There are no unrecorded private-course payment cycles for this student.');return;}recordPaymentForm(chosen.id);}

function sessionForm(forcedGroupId=null){if(!data.groups.length){toast(T('noGroup'));return;}let body=`<form id="sessionForm"><div class="formgrid"><div class="field"><label>${T('group')} *</label><select name="groupId" id="sessionGroup" required><option value="">${T('choose')}</option>${groupOptions(forcedGroupId||'')}</select></div><div class="field"><label>${T('date')}</label><input type="date" name="date" value="${today()}" required></div><div class="field"><label>${T('duration')}</label><input type="number" name="duration" min="1" value="90"></div><div class="field"><label>${T('notes')}</label><input name="notes"></div></div><div id="attendanceBox" class="notice">${T('selectGroup')}</div></form>`;modal(T('recordSession'),body,`<button class="btn" data-close>${T('cancel')}</button><button class="btn primary" id="saveSession">${T('saveSession')}</button>`);$('#sessionGroup').onchange=()=>{let gid=$('#sessionGroup').value,ss=activeStudents(gid);$('#attendanceBox').innerHTML=ss.length?`<strong>${T('markAttendance')}</strong>${ss.map(s=>`<div class="between" style="padding:7px 0;border-bottom:1px solid #dbeafe"><span>${esc(s.name)}</span><select name="att_${s.id}" style="max-width:145px;padding:6px;border:1px solid #bfdbfe;border-radius:7px"><option value="present">${T('present')}</option><option value="absent">${T('absent')}</option><option value="late">${T('late')}</option></select></div>`).join('')}`:`${T('studentsInGroup')}: 0`;};if(forcedGroupId)$('#sessionGroup').dispatchEvent(new Event('change'));$('#saveSession').onclick=()=>{let f=$('#sessionForm');if(!f.reportValidity())return;let fd=new FormData(f),gid=fd.get('groupId'),attendance={};activeStudents(gid).forEach(s=>attendance[s.id]=fd.get('att_'+s.id)||'present');data.sessions.push({id:uid(),groupId:gid,date:fd.get('date'),duration:Number(fd.get('duration')||0),notes:fd.get('notes'),attendance,createdAt:new Date().toISOString()});syncCycles(gid);save(false);closeModal();render();toast(gid&&group(gid)?.type==='private'&&sessionsFor(gid)%4===0?'Four group sessions completed. Review the group and record each student payment manually.':T('sessionSaved'));};}
function recordPaymentForm(obid=null,studentId=null,category=null,forcedGroupId=null){let ob=obid?data.obligations.find(o=>o.id===obid):null;let sid=studentId||ob?.studentId||'';let candidates=data.obligations.filter(o=>!o.exempt&&remaining(o)>0&&(!sid||o.studentId===sid)&&(!forcedGroupId||o.groupId===forcedGroupId)&&(!category||o.type===category||category==='book'&&o.type==='book'));let body=`<form id="paymentForm"><div class="formgrid"><div class="field full"><label>${T('obligation')} *</label><select name="obligationId" id="obSelect" required><option value="">${T('choose')}</option>${candidates.map(o=>`<option value="${o.id}" ${o.id===obid?'selected':''}>${esc(obligationLabel(o))} · ${money(remaining(o))}</option>`).join('')}</select></div><div class="field"><label>${T('date')}</label><input type="date" name="date" value="${today()}" required></div><div class="field"><label>${T('amount')} (DZD) *</label><input type="number" name="amount" min="1" step="1" required></div><div class="field"><label>${T('method')}</label><select name="method"><option>${T('cash')}</option><option>${T('transfer')}</option><option>${T('other')}</option></select></div><div class="field"><label>Reference / note</label><input name="note"></div></div><div id="paymentHint" class="notice">${ob?`${T('remaining')}: ${money(remaining(ob))}`:'Choose an obligation to see the balance.'}</div></form>`;modal(T('recordPayment'),body,`<button class="btn" data-close>${T('cancel')}</button><button class="btn primary" id="savePayment">${T('save')}</button>`);$('#obSelect').onchange=()=>{let o=data.obligations.find(x=>x.id===$('#obSelect').value);$('#paymentHint').textContent=o?`${T('remaining')}: ${money(remaining(o))}`:'';};$('#savePayment').onclick=()=>{let f=$('#paymentForm');if(!f.reportValidity())return;let fd=new FormData(f),o=data.obligations.find(x=>x.id===fd.get('obligationId')),amt=Number(fd.get('amount'));if(!o||amt<=0||amt>remaining(o)){toast('Amount must not exceed the remaining balance.');return;}let st=student(o.studentId),g=group(o.groupId),category=o.type==='private'?'private':o.type==='book'?'book':'cefr';let pay={id:uid(),obligationId:o.id,studentId:o.studentId,groupId:o.groupId,category,amount:amt,date:fd.get('date'),method:fd.get('method'),note:fd.get('note'),createdAt:new Date().toISOString()};{let rec={id:uid(),receiptNo:'R-'+new Date().getFullYear()+'-'+String(data.receipts.length+1).padStart(4,'0'),paymentId:pay.id,studentId:st.id,groupId:g.id,date:pay.date,amount:amt,totalFee:o.amount,previousPaid:totalPaid(o.id),balanceAfter:Math.max(0,remaining(o)-amt),courseLabel:o.label,category,method:pay.method,note:pay.note||''};data.receipts.push(rec);pay.receiptId=rec.id;lastReceipt=rec.id;}data.payments.push(pay);save(false);closeModal();render();toast(T('saved'));if(pay.receiptId)showReceipt(pay.receiptId);};}
function addBookForm(sid=null){let body=`<form id="bookForm"><div class="field"><label>${T('student')} *</label><select name="studentId" required><option value="">${T('choose')}</option>${activeStudents().map(s=>`<option value="${s.id}" ${sid===s.id?'selected':''}>${esc(s.name)} · ${esc(group(s.groupId)?.name||'')}</option>`).join('')}</select></div><div class="field"><label>${T('bookPrice')} (DZD) *</label><input type="number" name="amount" min="1" required></div><div class="field"><label>${T('date')}</label><input type="date" name="date" value="${today()}"></div><div class="field"><label>${T('notes')}</label><input name="note" placeholder="Book title / edition"></div></form><div class="notice">${T('bookRule')}</div>`;modal(T('addBook'),body,`<button class="btn" data-close>${T('cancel')}</button><button class="btn primary" id="saveBook">${T('save')}</button>`);$('#saveBook').onclick=()=>{let f=$('#bookForm');if(!f.reportValidity())return;let fd=new FormData(f),s=student(fd.get('studentId'));data.obligations.push({id:uid(),cycleKey:'book:'+uid(),groupId:s.groupId,studentId:s.id,type:'book',label:`${T('book')} – ${fd.get('note')||'Book'}`,amount:Number(fd.get('amount')),exempt:false,createdAt:new Date().toISOString()});save();closeModal();render();};}
function addBookFormForGroup(gid){let list=activeStudents(gid);if(!list.length){toast('Add a student to this group first.');return;}let body=`<form id="bookForm"><div class="field"><label>${T('student')} *</label><select name="studentId" required>${list.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>${T('bookPrice')} (DZD) *</label><input type="number" name="amount" min="1" required></div><div class="field"><label>${T('date')}</label><input type="date" name="date" value="${today()}"></div><div class="field"><label>${T('notes')}</label><input name="note" placeholder="Book title / edition"></div></form><div class="notice">Book charges belong 100% to the teacher and are not included in revenue sharing.</div>`;modal(T('addBook'),body,`<button class="btn" data-close>${T('cancel')}</button><button class="btn primary" id="saveBook">${T('save')}</button>`);$('#saveBook').onclick=()=>{let f=$('#bookForm');if(!f.reportValidity())return;let fd=new FormData(f),st=student(fd.get('studentId'));let ob={id:uid(),cycleKey:'book:'+uid(),groupId:gid,studentId:st.id,type:'book',label:`${T('book')} – ${fd.get('note')||'Book'}`,amount:Number(fd.get('amount')),exempt:false,createdAt:new Date().toISOString()};data.obligations.push(ob);save();closeModal();render();recordPaymentForm(ob.id);};}

function generateReceiptForPayment(paymentId){let p=data.payments.find(x=>x.id===paymentId);if(!p)return; if(p.receiptId){showReceipt(p.receiptId);return;}let o=data.obligations.find(x=>x.id===p.obligationId),previous=o?data.payments.filter(x=>x.obligationId===o.id&&x.id!==p.id).reduce((a,x)=>a+x.amount,0):0;let r={id:uid(),receiptNo:'R-'+new Date().getFullYear()+'-'+String(data.receipts.length+1).padStart(4,'0'),paymentId:p.id,studentId:p.studentId,groupId:p.groupId,date:p.date,amount:p.amount,totalFee:o?.amount||p.amount,previousPaid:previous,balanceAfter:o?Math.max(0,o.amount-previous-p.amount):0,courseLabel:o?.label||'',category:p.category||'cefr',method:p.method||'',note:p.note||''};data.receipts.push(r);p.receiptId=r.id;save();showReceipt(r.id);}
function showReceipt(id){let r=data.receipts.find(x=>x.id===id);if(!r)return;let s=student(r.studentId),g=group(r.groupId),cat=r.category||'cefr';let categoryLabel=cat==='private'?'Private course payment':cat==='book'?'Book payment':'CEFR course payment';let body=`<div class="receipt"><div class="school">${esc(data.settings.school||'SCHOOL NAME')}</div><div style="text-align:center">${esc(data.settings.teacher||'')}</div><h2>PAYMENT RECEIPT</h2><div style="text-align:center;color:#64748b;margin-bottom:18px">${esc(r.receiptNo)} · ${esc(r.date)}</div><div class="rline"><span>Student name</span><strong>${esc(s?.name||'—')}</strong></div><div class="rline"><span>Student ID</span><strong>${esc(s?.studentCode||s?.id||'—')}</strong></div><div class="rline"><span>Group / course</span><strong>${esc(g?.name||'—')}</strong></div><div class="rline"><span>Payment category</span><strong>${categoryLabel}</strong></div>${r.courseLabel?`<div class="rline"><span>Description</span><strong>${esc(r.courseLabel)}</strong></div>`:''}<div class="rline"><span>Amount received</span><strong>${money(r.amount)}</strong></div>${cat==='cefr'?`<div class="rline"><span>Total course fee</span><strong>${money(r.totalFee)}</strong></div><div class="rline"><span>Previously paid</span><strong>${money(r.previousPaid)}</strong></div><div class="rline"><span>Balance after payment</span><strong>${money(r.balanceAfter)}</strong></div>`:''}<div class="rline"><span>Payment method</span><strong>${esc(r.method||'—')}</strong></div>${r.note?`<div class="rline"><span>Note</span><strong>${esc(r.note)}</strong></div>`:''}<p style="text-align:center;margin-top:22px">${T('receiptNote')}</p><div class="signrow"><div class="sign">${esc(data.settings.signature||'Teacher signature')}</div><div class="sign">School stamp</div></div></div>`;modal(T('receipt'),body,`<button class="btn" data-close>${T('cancel')}</button><button class="btn primary" id="printReceipt">${T('print')}</button>`);$('#printReceipt').onclick=()=>window.print();}
function profile(id){let s=student(id),g=group(s.groupId);if(!s)return;let obs=data.obligations.filter(o=>o.studentId===id),pays=data.payments.filter(p=>p.studentId===id);let body=`<div class="between"><div><h3 style="margin:0">${esc(s.name)}</h3><div class="muted">${esc(g?.name||'')} · ${esc(s.studentCode||'')}</div></div><span class="badge green">${T('active')}</span></div><div class="grid two" style="margin:15px 0"><div class="card"><div class="muted">${T('phone')}</div><strong>${esc(s.phone||'—')}</strong></div><div class="card"><div class="muted">${T('outstanding')}</div><strong>${money(obs.reduce((a,o)=>a+remaining(o),0))}</strong></div></div><div class="between"><h4>${T('duePayments')}</h4><button class="btn small" data-action="profile-pay" data-id="${id}">${T('recordPayment')}</button></div>${obs.map(o=>`<div class="between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${esc(o.label)}</span><strong>${money(remaining(o))}</strong></div>`).join('')||T('noObligations')}<h4 style="margin-top:18px">${T('paymentHistory')}</h4>${pays.map(p=>`<div class="between" style="padding:7px 0;border-bottom:1px solid var(--line)"><span>${esc(p.date)} · ${esc(p.category)}</span><strong>${money(p.amount)}</strong></div>`).join('')||T('noData')}<div class="row" style="margin-top:18px"><button class="btn" data-action="profile-book" data-id="${id}">${T('addBook')}</button></div>`;modal(T('studentProfile'),body,`<button class="btn" data-close>${T('cancel')}</button><button class="btn primary" data-action="edit-student" data-id="${id}">${T('edit')}</button>`);}
function archiveStudent(id){if(!confirm(T('deleteStudentWarn')))return;let s=student(id);if(s){s.active=false;save();render();}}
function exportJSON(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});download(blob,'private-teaching-manager-backup-'+today()+'.json')}
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function importJSON(){let inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>{let file=inp.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.version||!Array.isArray(x.students)||!Array.isArray(x.groups))throw Error();makeBackup();data=x;save();render();toast(T('saved'));}catch(e){alert('This file is not a valid Teaching Manager backup.');}};r.readAsText(file)};inp.click()}
function exportCSV(){let lines=[['Date','Student','Group','Category','Amount DZD','Method'],...data.payments.map(p=>[p.date,student(p.studentId)?.name||'',group(p.groupId)?.name||'',p.category,p.amount,p.method])];let csv=lines.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'teaching-payments-'+today()+'.csv')}
function restoreBackup(id){let b=JSON.parse(localStorage.getItem(BACKKEY)||'[]').find(x=>x.id===id);if(!b)return;if(!confirm(T('restoreConfirm')))return;makeBackup();data=JSON.parse(JSON.stringify(b.data));save();render();toast(T('saved'))}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;$$('#nav button').forEach(x=>x.classList.toggle('active',x===b));render();}});$('#view').addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page=p.dataset.page;$$('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===page));render();return;}let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;switch(a){case'add-student':studentForm();break;case'edit-student':studentForm(id);break;case'archive-student':archiveStudent(id);break;case'profile':profile(id);break;case'add-group':groupForm();break;case'open-group':selectedGroupId=id;render();document.getElementById('groupWorkspace')?.scrollIntoView({behavior:'smooth',block:'start'});break;case'group-add-student':studentForm(null,id);break;case'group-add-session':sessionForm(id);break;case'group-record-payment':recordPaymentForm(null,null,null,id);break;case'group-student-pay':startPrivatePayment(id,b.dataset.group||student(id)?.groupId);break;case'group-add-book':addBookFormForGroup(id);break;case'edit-group':groupForm(id);break;case'delete-group':if(!data.students.some(s=>s.groupId===id)&&!data.sessions.some(s=>s.groupId===id)&&confirm(T('confirmDelete'))){data.groups=data.groups.filter(g=>g.id!==id);save();render();}else toast('Move/archive students and retain session history before deleting this group.');break;case'add-session':sessionForm();break;case'record-payment':recordPaymentForm();break;case'pay-obligation':recordPaymentForm(id);break;case'add-book':addBookForm();break;case'view-receipt':showReceipt(id);break;case'generate-receipt':generateReceiptForPayment(id);break;case'profile-pay':closeModal();recordPaymentForm(null,id);break;case'profile-book':closeModal();addBookForm(id);break;case'backup-now':makeBackup();toast(T('saved'));render();break;case'export-json':exportJSON();break;case'import-json':importJSON();break;case'restore-backup':restoreBackup(id);break;case'export-csv':exportCSV();break;}});
$('#quickSession').onclick=sessionForm;$('#language').onchange=e=>{lang=e.target.value;render();};$('#modalClose').onclick=closeModal;$('#modalback').addEventListener('click',e=>{if(e.target===$('#modalback')){closeModal();return;}let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;if(a==='profile-pay'){closeModal();recordPaymentForm(null,id);}else if(a==='profile-book'){closeModal();addBookForm(id);}else if(a==='edit-student'){closeModal();studentForm(id);}});
// First-run example group names are intentionally not pre-populated; create only what the teacher actually uses.
if(!localStorage.getItem(DBKEY)){data=blank();localStorage.setItem(DBKEY,JSON.stringify(data));makeBackup();}
let deferredInstallPrompt=null;const installBtn=$('#installApp');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;installBtn.hidden=false;});installBtn.addEventListener('click',async()=>{if(!deferredInstallPrompt){toast('Use Chrome menu → Install page as app.');return;}deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;installBtn.hidden=true;});window.addEventListener('appinstalled',()=>{installBtn.hidden=true;toast('Private Teaching Manager installed.');});
if('serviceWorker'in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).then(reg=>reg.update()).catch(console.warn));}
render();
})();
</script></body></html>
